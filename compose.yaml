services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace
    tty: true
    stdin_open: true
    command: sleep infinity

  server:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace
    ports:
      - "${DB_SERVER_PORT:-8080}:${DB_SERVER_PORT:-8080}"
    environment:
      DB_SERVER_PORT: ${DB_SERVER_PORT:-8080}
      DB_SERVER_WORKERS: ${DB_SERVER_WORKERS:-4}
    command: bash -lc "make server && ./SERVER-RUNTIME/scripts/run-server.sh"
